name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys overlap on the same server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Build here so the server only needs to serve static files (no Node on the VPS).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          [ -n "$VITE_API_URL" ] || { echo "VITE_API_URL variable is not set"; exit 1; }
          npm run build

      # Replaces the site's web root (CloudPanel Root Directory: htdocs/<domain>/frontend/dist).
      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port:     ${{ secrets.VPS_PORT }}
          source: frontend/dist/*
          target: ${{ secrets.VPS_APP_PATH }}/frontend/dist
          strip_components: 2
          rm: true
